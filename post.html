<!DOCTYPE html>
<html lang="ko" data-bs-theme="auto">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post - ahh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (() => {
      const getPreferredTheme = () => {
        const storedTheme = localStorage.getItem('theme')
        if (storedTheme) return storedTheme
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.documentElement.setAttribute('data-bs-theme', getPreferredTheme())
    })()
  </script>
  <style>
    .post-content {
      position: relative;
      min-height: 1px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    #post-title {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .post-content :is(p, li, blockquote, h1, h2, h3, h4, h5, h6, td, th) {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .post-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 1.5rem 0;
    }

    .post-content pre {
      background: var(--bs-tertiary-bg);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
    }

    .post-content blockquote {
      border-left: 4px solid var(--bs-primary);
      padding-left: 1rem;
      color: var(--bs-secondary-color);
    }

    .post-content code {
      background: var(--bs-tertiary-bg);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 0.875em;
      font-weight: 600;
    }

    .post-content pre code {
      background: none;
      padding: 0;
      font-size: inherit;
      font-weight: inherit;
    }
  </style>
</head>

<body class="d-flex flex-column h-100">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand p-0" href="/">ahh</a>
      <div class="navbar-nav ms-auto flex-row">
        <a class="nav-link me-3" href="/about/">About</a>
        <a class="nav-link me-3" href="/portfolio/">Portfolio</a>
        <button class="btn btn-link nav-link p-0" id="theme-toggle" type="button" aria-label="테마 전환">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-circle-half" aria-hidden="true" focusable="false"
            viewBox="0 0 16 16">
            <path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z" />
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="container mt-5 flex-shrink-0">
    <article id="post-container">
      <header class="mb-5">
        <h1 id="post-title" class="fw-bold mb-2">Loading...</h1>
        <p id="post-date" class="text-muted font-monospace"></p>
      </header>
      <div id="post-content" class="post-content"></div>
    </article>
  </main>

  <footer class="footer mt-auto py-3">
    <div class="container text-center">
      <span class="text-muted small">© 2024 ahh</span>
    </div>
  </footer>

  <script type="module">
    const { marked } = window

    const EMBED_HEIGHT_MESSAGES = new Set(['parser-js-height', 'pretext-demo-height', 'kmg-slider-height'])

    const postTitleEl = document.getElementById('post-title')
    const postDateEl = document.getElementById('post-date')
    const postContentEl = document.getElementById('post-content')
    const themeToggleEl = document.getElementById('theme-toggle')

    function normalizeFrontmatterValue(value) {
      const trimmed = value.trim()
      if ((trimmed.startsWith('"') && trimmed.endsWith('"')) || (trimmed.startsWith("'") && trimmed.endsWith("'"))) {
        return trimmed.slice(1, -1)
      }
      return trimmed
    }

    function extractFrontmatter(markdown) {
      const match = markdown.match(/^---\r?\n([\s\S]+?)\r?\n---\r?\n?/)
      const data = {}
      let body = markdown

      if (match) {
        const lines = match[1].split(/\r?\n/)
        for (const line of lines) {
          const separatorIndex = line.indexOf(':')
          if (separatorIndex === -1) continue
          const key = line.slice(0, separatorIndex).trim()
          const value = line.slice(separatorIndex + 1)
          if (!key) continue
          data[key] = normalizeFrontmatterValue(value)
        }
        body = markdown.slice(match[0].length)
      }

      return { data, body }
    }

    async function fetchPostContent(postId) {
      let postEntry = null

      try {
        const postsResponse = await fetch('/assets/data/posts.json')
        if (postsResponse.ok) {
          const posts = await postsResponse.json()
          postEntry = Array.isArray(posts) ? posts.find(entry => entry.id === postId) || null : null
        }
      } catch (error) {
        console.warn('Failed to read posts.json, trying direct markdown path.', error)
      }

      if (postEntry?.path) {
        const entryResponse = await fetch(`/_posts/${postEntry.path}`)
        if (entryResponse.ok) {
          return {
            postEntry,
            markdown: await entryResponse.text(),
          }
        }
      }

      const fallbackPaths = [
        `/_posts/${postId}.md`,
        `/_posts/old/${postId}.md`,
      ]

      for (const fallbackPath of fallbackPaths) {
        const fallbackResponse = await fetch(fallbackPath)
        if (fallbackResponse.ok) {
          return {
            postEntry,
            markdown: await fallbackResponse.text(),
          }
        }
      }

      throw new Error('Post not found')
    }

    function findIframeByContentWindow(contentWindow) {
      for (const iframe of postContentEl.querySelectorAll('iframe')) {
        if (iframe.contentWindow === contentWindow) {
          return iframe
        }
      }
      return null
    }

    function handleEmbeddedFrameMessage(event) {
      if (event.origin !== window.location.origin) {
        return
      }

      const data = event.data
      if (!data || !EMBED_HEIGHT_MESSAGES.has(data.type)) {
        return
      }

      const iframe = (data.frameId && document.getElementById(data.frameId)) || findIframeByContentWindow(event.source)
      if (!(iframe instanceof HTMLIFrameElement)) {
        return
      }

      const requestedHeight = Math.ceil(Number(data.height))
      if (!Number.isFinite(requestedHeight) || requestedHeight < 1) {
        return
      }

      iframe.style.height = `${requestedHeight}px`
    }

    async function loadPost() {
      const urlParams = new URLSearchParams(window.location.search)
      const postId = urlParams.get('id')

      if (!postId) {
        window.location.href = '/'
        return
      }

      try {
        const { postEntry, markdown } = await fetchPostContent(postId)
        const { data, body } = extractFrontmatter(markdown)
        const title = data.title || postEntry?.title || postId
        const date = data.date || postEntry?.fullDate || postEntry?.date || ''

        document.title = `${title} - ahh`
        postTitleEl.textContent = title
        postDateEl.textContent = date
        postContentEl.innerHTML = marked.parse(body)
      } catch (error) {
        console.error(error)
        postTitleEl.textContent = 'Error'
        postDateEl.textContent = ''
        postContentEl.innerHTML = '<p>포스트를 불러오는데 실패했습니다.</p>'
      }
    }

    themeToggleEl.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-bs-theme')
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark'
      document.documentElement.setAttribute('data-bs-theme', newTheme)
      localStorage.setItem('theme', newTheme)
    })

    window.addEventListener('message', handleEmbeddedFrameMessage)

    loadPost()
  </script>
</body>

</html>
