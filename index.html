<!DOCTYPE html>
<html lang="ko" data-bs-theme="auto">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ahh - insanities</title>
  <meta name="description" content="insanities">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    (() => {
      const getPreferredTheme = () => {
        const storedTheme = localStorage.getItem('theme')
        if (storedTheme) return storedTheme
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.documentElement.setAttribute('data-bs-theme', getPreferredTheme())
    })()
  </script>
</head>

<body class="d-flex flex-column h-100">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand p-0" href="/">ahh</a>
      <div class="navbar-nav ms-auto flex-row">
        <a class="nav-link me-3" href="/about/">About</a>
        <a class="nav-link me-3" href="/portfolio/">Portfolio</a>
        <button class="btn btn-link nav-link p-0" id="theme-toggle" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-circle-half"
            viewBox="0 0 16 16">
            <title>Toggle theme</title>
            <path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z" />
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="container flex-shrink-0">
    <div id="virtual-list-viewport" style="min-height: 80vh;">
      <div id="virtual-list-content"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    const content = document.getElementById('virtual-list-content');
    const themeToggle = document.getElementById('theme-toggle');

    function renderPosts(posts) {
      const fragment = document.createDocumentFragment();
      let currentYear = null;

      posts.forEach((post) => {
        if (post.year !== currentYear) {
          currentYear = post.year;
          const year = document.createElement('h1');
          year.className = 'archive-year';
          year.textContent = String(currentYear);
          fragment.appendChild(year);
        }

        const item = document.createElement('div');
        item.className = 'archive-item';

        const link = document.createElement('a');
        link.className = 'archive-title';
        link.href = post.url;
        link.textContent = post.title;

        const date = document.createElement('span');
        date.className = 'archive-date text-muted font-monospace';
        date.textContent = post.date;

        item.append(link, date);
        fragment.appendChild(item);
      });

      content.replaceChildren(fragment);
    }

    async function init() {
      try {
        const response = await fetch('/assets/data/posts.json');
        const posts = await response.json();

        posts.sort((a, b) => {
          const dateDiff = new Date(b.date) - new Date(a.date);
          if (dateDiff !== 0) {
            return dateDiff;
          }

          const sequenceA = Number.isFinite(a.sequence) ? a.sequence : Number.MAX_SAFE_INTEGER;
          const sequenceB = Number.isFinite(b.sequence) ? b.sequence : Number.MAX_SAFE_INTEGER;
          return sequenceA - sequenceB;
        });
        renderPosts(posts);
      } catch (e) {
        console.error('Failed to load posts', e);
      }
    }

    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-bs-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    init();
  </script>
</body>

</html>
